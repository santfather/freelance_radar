<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎯 Freelance Radar</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --text: #e2e8f0; --text-muted: #94a3b8;
    --take: #22c55e; --skip: #ef4444; --unknown: #f59e0b;
    --accent: #6366f1; --accent2: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--accent); }

  .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-left: auto; }
  .stat { text-align: center; }
  .stat .val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

  .toolbar {
    padding: 12px 24px; display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; border-bottom: 1px solid var(--border);
  }
  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity .2s; white-space: nowrap;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-outline {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .btn-outline:hover { border-color: var(--accent); }
  .btn-analyze {
    background: #7c3aed;
  }
  .btn-icon {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 8px; padding: 8px 10px; font-size: 15px; cursor: pointer; line-height: 1;
    transition: border-color .2s, color .2s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--text); }
  .btn-icon.active { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,.1); }

  select, .filter-btn {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .filter-btn { display: inline-flex; gap: 6px; }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); }

  .log-box {
    margin: 0 24px 0; background: #0a0c14; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 12px; font-family: monospace;
    color: var(--text-muted); max-height: 0; overflow: hidden; transition: max-height .3s;
  }
  .log-box.visible { max-height: 200px; margin-bottom: 12px; overflow-y: auto; }

  .content { padding: 24px; }

  .category-section { margin-bottom: 32px; }
  .category-title {
    font-size: 14px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .category-title .cnt {
    background: var(--border); border-radius: 999px; padding: 2px 8px;
    font-size: 11px; color: var(--text-muted);
  }

  .job-grid { display: grid; gap: 12px; }

  /* List layout */
  .job-grid.list-layout {
    grid-template-columns: 1fr !important;
    gap: 8px;
  }
  .job-grid.list-layout .job-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px;
  }
  .job-grid.list-layout .job-card .job-header { margin-bottom: 0; flex-shrink: 0; width: auto; }
  .job-grid.list-layout .job-card .job-desc { display: none; }
  .job-grid.list-layout .job-card .job-reason { display: none; }
  .job-grid.list-layout .job-card .job-meta { flex: 1; margin: 0; min-width: 0; }
  .job-grid.list-layout .job-card .job-title a {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; display: inline-block; vertical-align: bottom;
  }
  .job-grid.list-layout .job-card .complexity-dots { display: none; }
  .job-grid.list-layout .job-card .meta-item { white-space: nowrap; }
  @media (max-width: 800px) {
    .job-grid.list-layout .job-card .job-title a { max-width: 120px; }
    .job-grid.list-layout .job-card { gap: 6px; }
  }

  /* Grid */
  @media (min-width: 900px) {
    .job-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1400px) {
    .job-grid { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🎯 Freelance <span>Radar</span></h1>
  <div class="stats">
    <div class="stat"><div class="val" id="stat-total">—</div><div class="lbl">Всего</div></div>
    <div class="stat"><div class="val" id="stat-analyzed">—</div><div class="lbl">Проанализировано</div></div>
    <div class="stat"><div class="val" id="stat-unanalyzed" style="color:var(--unknown)">—</div><div class="lbl">В очереди</div></div>
    <div class="stat"><div class="val" style="color:var(--take)" id="stat-take">—</div><div class="lbl">БРАТЬ</div></div>
  </div>
  <div id="provider-status" class="provider-status unknown">⏳ Проверка...</div>
</header>

<div class="status-bar">
  <div class="status-item">
    <div id="scrape-dot" class="status-dot"></div>
    <span id="scrape-label">Парсинг: не запущен</span>
  </div>
  <div class="status-item">
    <div id="analyze-dot" class="status-dot"></div>
    <span id="analyze-label">Анализ: не запущен</span>
  </div>
</div>

<div class="toolbar">
  <button class="btn" id="btn-scrape" onclick="startScrape()">🔄 Запустить парсинг</button>
  <button class="btn btn-analyze" id="btn-analyze" onclick="startAnalysis()">🧠 Запустить анализ</button>
  <button class="btn btn-outline" id="btn-reanalyze" onclick="startReanalysis()" style="border-color:#7c3aed;color:#a78bfa">🔄 Переанализировать всё</button>

  <div class="provider-select-wrap">
    <label for="provider-select">Анализатор:</label>
    <select id="provider-select" onchange="changeProvider(this.value)">
      <option value="ollama">Ollama (локально)</option>
      <option value="deepseek">DeepSeek API</option>
      <option value="gemini">Gemini API</option>
    </select>
  </div>

  <select id="filter-verdict" onchange="loadJobs()">
    <option value="all">Все вердикты</option>
    <option value="take">✅ БРАТЬ</option>
    <option value="skip">❌ Пропустить</option>
    <option value="unknown">⏳ Не проанализировано</option>
  </select>

  <select id="filter-analyzed" onchange="loadJobs()">
    <option value="all">Любой анализ</option>
    <option value="0">Только без анализа</option>
    <option value="1">Только проанализированные</option>
  </select>

  <select id="filter-category" onchange="loadJobs()">
    <option value="all">Все категории</option>
    <option value="Web App">🌐 Web App</option>
    <option value="Mobile App">📱 Mobile App</option>
    <option value="CMS">🔧 CMS</option>
    <option value="Other IT">💻 Other IT</option>
  </select>

  <button class="btn btn-outline" onclick="toggleLog()">📋 Лог</button>

  <span style="flex:1"></span>

  <button class="btn-icon" id="btn-sort" onclick="toggleSort()" title="Сортировка">↑ Новые</button>
  <button class="btn-icon active" id="btn-grid" onclick="setView('grid')" title="Плитки">⊞</button>
  <button class="btn-icon" id="btn-list" onclick="setView('list')" title="Список">≡</button>
</div>

<div id="log-box" class="log-box"></div>

<div id="progress-wrap" class="progress-bar-wrap hidden">
  <div id="progress-fill" class="progress-bar-fill"></div>
</div>
<div id="progress-label" class="progress-label hidden"></div>

<div class="content" id="content">
  <div class="empty">Нажми «Запустить парсинг» чтобы собрать заказы</div>
</div>

<script>
const CATEGORIES = ["Web App", "Mobile App", "CMS", "Other IT"];
const CAT_ICONS = { "Web App": "🌐", "Mobile App": "📱", "CMS": "🔧", "Other IT": "💻" };
let logVisible = false;
let pollInterval = null;
let sortDir = 'desc';
let viewMode = 'grid';

async function loadStats() {
  const r = await fetch('/api/stats').then(r => r.json());
  document.getElementById('stat-total').textContent = r.total ?? '—';
  document.getElementById('stat-analyzed').textContent = r.analyzed ?? '—';
  document.getElementById('stat-unanalyzed').textContent = r.unanalyzed ?? '—';
  document.getElementById('stat-take').textContent = r.take ?? '—';

  // Provider status
  const provEl = document.getElementById('provider-status');
  const prov = r.provider || 'ollama';
  const avail = r.available_providers?.[prov];
  if (avail?.ok) {
    provEl.className = 'provider-status ok';
    provEl.textContent = '🟢 ' + (avail.msg || prov + ' OK');
  } else if (avail) {
    provEl.className = 'provider-status err';
    provEl.textContent = '🔴 ' + (avail.msg || prov + ' недоступен');
  } else {
    provEl.className = 'provider-status unknown';
    provEl.textContent = '⏳ Информация...';
  }

  // Provider selector sync
  document.getElementById('provider-select').value = prov;

  // Log
  if (r.log && r.log.length) {
    document.getElementById('log-box').innerHTML = r.log.map(l => `<div>${escHtml(l)}</div>`).join('');
  }

  // Status indicators
  updateScrapeStatus(r.scraping);
  updateAnalyzeStatus(r.analyzing, r.analyze_progress, r.analyze_total);

  // Progress
  updateProgressUI(r);

  // Button states
  document.getElementById('btn-scrape').disabled = !!r.scraping;
  document.getElementById('btn-analyze').disabled = !!r.analyzing;
  document.getElementById('btn-reanalyze').disabled = !!r.analyzing;

  return r;
}

function updateScrapeStatus(running) {
  const dot = document.getElementById('scrape-dot');
  const label = document.getElementById('scrape-label');
  if (running) {
    dot.className = 'status-dot active';
    label.textContent = 'Парсинг: выполняется...';
  } else {
    dot.className = 'status-dot';
    label.textContent = 'Парсинг: не запущен';
  }
}

function updateAnalyzeStatus(running, progress, total) {
  const dot = document.getElementById('analyze-dot');
  const label = document.getElementById('analyze-label');
  if (running) {
    dot.className = 'status-dot active';
    label.textContent = `Анализ: ${progress || 0} / ${total || '?'}`;
  } else {
    dot.className = 'status-dot';
    label.textContent = 'Анализ: не запущен';
  }
}

function updateProgressUI(s) {
  const wrap = document.getElementById('progress-wrap');
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');

  if (s.analyzing && s.analyze_total > 0) {
    const total = s.analyze_total || 1;
    const done = s.analyze_progress || 0;
    const pct = Math.min(100, Math.round((done / total) * 100));
    fill.style.width = pct + '%';
    fill.className = 'progress-bar-fill analysis';
    label.textContent = `🧠 Анализ: ${done} / ${total} (${pct}%)`;
    wrap.classList.remove('hidden');
    label.classList.remove('hidden');
  } else if (s.scraping) {
    fill.style.width = '30%';
    fill.className = 'progress-bar-fill';
    label.textContent = '⏳ Парсинг вакансий...';
    label.classList.remove('hidden');
    wrap.classList.remove('hidden');
  } else {
    wrap.classList.add('hidden');
    label.classList.add('hidden');
  }
}

async function loadJobs() {
  const verdict = document.getElementById('filter-verdict').value;
  const category = document.getElementById('filter-category').value;
  const analyzed = document.getElementById('filter-analyzed').value;
  const params = new URLSearchParams({ verdict, category, analyzed, sort: sortDir });
  const jobs = await fetch(`/api/jobs?${params}`).then(r => r.json());

  const content = document.getElementById('content');
  if (!jobs.length) {
    content.innerHTML = '<div class="empty">Нет заказов по выбранным фильтрам</div>';
    return;
  }

  // Group by category
  const byCategory = {};
  CATEGORIES.forEach(c => byCategory[c] = []);
  jobs.forEach(j => {
    const cat = j.category || 'Other IT';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(j);
  });

  let html = '';
  for (const cat of CATEGORIES) {
    const list = byCategory[cat];
    if (!list.length) continue;
    html += `<div class="category-section">
      <div class="category-title">${CAT_ICONS[cat] || '📁'} ${cat} <span class="cnt">${list.length}</span></div>
      <div class="job-grid${viewMode === 'list' ? ' list-layout' : ''}">`;
    for (const job of list) {
      html += renderCard(job);
    }
    html += `</div></div>`;
  }
  content.innerHTML = html;
}

function renderCard(job) {
  const v = job.verdict || 'UNKNOWN';
  const cls = v === 'TAKE' ? 'take' : v === 'SKIP' ? 'skip' : 'unknown';
  let badge;
  if (v === 'TAKE') badge = '✅ БРАТЬ';
  else if (v === 'SKIP') badge = '❌ Пропустить';
  else if (job.analyzed) badge = '❓ Неизвестно';
  else badge = '⏳ Ожидает анализа';
  const complexity = job.complexity || 0;
  const dots = Array.from({length: 5}, (_, i) =>
    `<div class="dot${i < complexity ? ' on' : ''}"></div>`
  ).join('');

  const budget = job.budget_raw ? `💰 ${job.budget_raw}` : '';
  const hours = job.estimated_hours ? `⏱ ~${job.estimated_hours}h` : '';
  const source = job.source ? `📌 ${job.source}` : '';
  const posted = job.posted_at ? `🕐 ${job.posted_at}` : '';

  const descPreview = job.description
    ? escHtml(job.description.slice(0, 180)) + (job.description.length > 180 ? '…' : '')
    : '';

  return `<div class="job-card ${cls}">
    <div class="job-header">
      <span class="verdict-badge ${v}">${badge}</span>
      <div class="job-title"><a href="${job.url}" target="_blank">${escHtml(job.title)}</a></div>
    </div>
    ${descPreview ? `<div class="job-desc">${descPreview}</div>` : ''}
    <div class="job-meta">
      ${budget ? `<span class="meta-item">${escHtml(budget)}</span>` : ''}
      ${hours ? `<span class="meta-item">${hours}</span>` : ''}
      ${complexity ? `<span class="meta-item">Сложность <div class="complexity-dots">${dots}</div></span>` : ''}
      ${source ? `<span class="meta-item">${escHtml(source)}</span>` : ''}
      ${posted ? `<span class="meta-item">${escHtml(posted)}</span>` : ''}
    </div>
    ${job.verdict_reason ? `<div class="job-reason">💬 ${escHtml(job.verdict_reason)}</div>` : ''}
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function startScrape() {
  const btn = document.getElementById('btn-scrape');
  btn.disabled = true;
  btn.textContent = '⏳ Парсинг...';
  document.getElementById('log-box').classList.add('visible');
  logVisible = true;

  await fetch('/api/refresh', {method: 'POST'});

  // Poll until done
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    const s = await fetch('/api/stats').then(r => r.json()).catch(() => ({}));
    updateProgressUI(s);
    updateScrapeStatus(s.scraping);
    if (s.log) document.getElementById('log-box').innerHTML = s.log.map(l => `<div>${escHtml(l)}</div>`).join('');
    document.getElementById('stat-total').textContent = s.total ?? '—';
    document.getElementById('stat-analyzed').textContent = s.analyzed ?? '—';
    document.getElementById('stat-unanalyzed').textContent = s.unanalyzed ?? '—';
    document.getElementById('stat-take').textContent = s.take ?? '—';
    if (!s.scraping && !s.analyzing) {
      clearInterval(pollInterval); pollInterval = null;
      btn.disabled = false;
      btn.textContent = '🔄 Запустить парсинг';
      await loadJobs();
      await loadStats();
    }
  }, 1500);
}

async function startAnalysis() {
  const btn = document.getElementById('btn-analyze');
  btn.disabled = true;
  btn.textContent = '⏳ Анализ...';
  document.getElementById('log-box').classList.add('visible');
  logVisible = true;

  const r = await fetch('/api/analyze', {method: 'POST'}).then(r => r.json());
  if (r.status === 'already_running') {
    btn.disabled = false;
    btn.textContent = '🧠 Запустить анализ';
    return;
  }

  // Poll until done
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    const s = await fetch('/api/stats').then(r => r.json()).catch(() => ({}));
    updateProgressUI(s);
    updateAnalyzeStatus(s.analyzing, s.analyze_progress, s.analyze_total);
    if (s.log) document.getElementById('log-box').innerHTML = s.log.map(l => `<div>${escHtml(l)}</div>`).join('');
    document.getElementById('stat-total').textContent = s.total ?? '—';
    document.getElementById('stat-analyzed').textContent = s.analyzed ?? '—';
    document.getElementById('stat-unanalyzed').textContent = s.unanalyzed ?? '—';
    document.getElementById('stat-take').textContent = s.take ?? '—';
    if (!s.analyzing && !s.scraping) {
      clearInterval(pollInterval); pollInterval = null;
      btn.disabled = false;
      btn.textContent = '🧠 Запустить анализ';
      await loadJobs();
      await loadStats();
    }
  }, 1500);
}

async function startReanalysis() {
  const btn = document.getElementById('btn-reanalyze');
  const btnAnalyze = document.getElementById('btn-analyze');
  btn.disabled = true;
  btnAnalyze.disabled = true;
  btn.textContent = '⏳ Переанализ...';
  document.getElementById('log-box').classList.add('visible');
  logVisible = true;

  // Показываем подтверждение
  const total = document.getElementById('stat-total').textContent;
  if (!confirm(`Сбросить все вердикты и переанализировать все ${total} заказов?`)) {
    btn.disabled = false;
    btnAnalyze.disabled = false;
    btn.textContent = '🔄 Переанализировать всё';
    return;
  }

  const r = await fetch('/api/analyze?force=true', {method: 'POST'}).then(r => r.json());
  if (r.status === 'already_running') {
    btn.disabled = false;
    btnAnalyze.disabled = false;
    btn.textContent = '🔄 Переанализировать всё';
    return;
  }

  // Poll until done
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    const s = await fetch('/api/stats').then(r => r.json()).catch(() => ({}));
    updateProgressUI(s);
    updateAnalyzeStatus(s.analyzing, s.analyze_progress, s.analyze_total);
    if (s.log) document.getElementById('log-box').innerHTML = s.log.map(l => `<div>${escHtml(l)}</div>`).join('');
    document.getElementById('stat-total').textContent = s.total ?? '—';
    document.getElementById('stat-analyzed').textContent = s.analyzed ?? '—';
    document.getElementById('stat-unanalyzed').textContent = s.unanalyzed ?? '—';
    document.getElementById('stat-take').textContent = s.take ?? '—';
    if (!s.analyzing && !s.scraping) {
      clearInterval(pollInterval); pollInterval = null;
      btn.disabled = false;
      btnAnalyze.disabled = false;
      btn.textContent = '🔄 Переанализировать всё';
      await loadJobs();
      await loadStats();
    }
  }, 1500);
}

async function changeProvider(provider) {
  const oldText = document.getElementById('provider-select').options[
    document.getElementById('provider-select').selectedIndex
  ].text;
  await fetch('/api/settings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({provider}),
  });
  await loadStats();
}

function toggleLog() {
  logVisible = !logVisible;
  document.getElementById('log-box').classList.toggle('visible', logVisible);
}

function toggleSort() {
  sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  const btn = document.getElementById('btn-sort');
  btn.textContent = sortDir === 'desc' ? '↑ Новые' : '↓ Старые';
  loadJobs();
}

function setView(mode) {
  viewMode = mode;
  document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
  document.getElementById('btn-list').classList.toggle('active', mode === 'list');
  loadJobs();
}

// Init
(async () => {
  await loadStats();
  await loadJobs();
})();
</script>
</body>
</html>
