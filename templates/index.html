<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎯 Freelance Radar</title>
<link rel="stylesheet" href="/static/styles.css"/>
</head>
<body>

<header>
  <h1>🎯 Freelance <span>Radar</span></h1>
  <div class="stats">
    <div class="stat"><div class="val" id="stat-total">—</div><div class="lbl">Всего</div></div>
    <div class="stat"><div class="val" id="stat-analyzed">—</div><div class="lbl">Проанализировано</div></div>
    <div class="stat"><div class="val" id="stat-unanalyzed" style="color:var(--unknown)">—</div><div class="lbl">В очереди</div></div>
    <div class="stat"><div class="val" style="color:var(--take)" id="stat-take">—</div><div class="lbl">БРАТЬ</div></div>
  </div>
  <div id="provider-status" class="provider-status unknown">⏳ Проверка...</div>
</header>

<div class="status-bar">
  <div class="status-item">
    <div id="scrape-dot" class="status-dot"></div>
    <span id="scrape-label">Парсинг: не запущен</span>
  </div>
  <div class="status-item">
    <div id="analyze-dot" class="status-dot"></div>
    <span id="analyze-label">Анализ: не запущен</span>
  </div>
</div>

<div class="toolbar">
  <button class="btn" id="btn-scrape" onclick="startScrape()">🔄 Запустить парсинг</button>
  <button class="btn btn-analyze" id="btn-analyze" onclick="startAnalysis()">🧠 Запустить анализ</button>
  <button class="btn btn-outline" id="btn-reanalyze" onclick="startReanalysis()" style="border-color:#7c3aed;color:#a78bfa">🔄 Переанализировать всё</button>

  <div class="provider-select-wrap">
    <label for="provider-select">Анализатор:</label>
    <select id="provider-select" onchange="changeProvider(this.value)">
      <option value="ollama">Ollama (локально)</option>
      <option value="deepseek">DeepSeek API</option>
      <option value="gemini">Gemini API</option>
    </select>
  </div>

  <select id="filter-verdict" onchange="loadJobs()">
    <option value="all">Все вердикты</option>
    <option value="take">✅ БРАТЬ</option>
    <option value="skip">❌ Пропустить</option>
    <option value="unknown">⏳ Не проанализировано</option>
  </select>

  <select id="filter-analyzed" onchange="loadJobs()">
    <option value="all">Любой анализ</option>
    <option value="0">Только без анализа</option>
    <option value="1">Только проанализированные</option>
  </select>

  <select id="filter-category" onchange="loadJobs()">
    <option value="all">Все категории</option>
    <option value="Web App">🌐 Web App</option>
    <option value="Mobile App">📱 Mobile App</option>
    <option value="CMS">🔧 CMS</option>
    <option value="Other IT">💻 Other IT</option>
  </select>

  <button class="btn btn-outline" onclick="toggleLog()">📋 Лог</button>

  <span style="flex:1"></span>

  <button class="btn-icon" id="btn-sort" onclick="toggleSort()" title="Сортировка">↑ Новые</button>
  <button class="btn-icon active" id="btn-grid" onclick="setView('grid')" title="Плитки">⊞</button>
  <button class="btn-icon" id="btn-list" onclick="setView('list')" title="Список">≡</button>
</div>

<div id="log-box" class="log-box"></div>

<div id="progress-wrap" class="progress-bar-wrap hidden">
  <div id="progress-fill" class="progress-bar-fill"></div>
</div>
<div id="progress-label" class="progress-label hidden"></div>

<div class="content" id="content">
  <div class="empty">Нажми «Запустить парсинг» чтобы собрать заказы</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
